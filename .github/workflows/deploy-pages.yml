name: Deploy ACUL to GitHub Pages

on:
  push:
    branches:
      - local
      - development
      - staging
      - master
  workflow_dispatch:
    inputs:
      target_environment:
        description: Auth0 environment to configure
        required: true
        type: choice
        default: development
        options:
          - local
          - development
          - staging
          - production

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: acul-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      target_environment: ${{ steps.resolve.outputs.target_environment }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
    steps:
      - name: Resolve deployment environment
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target_environment="${{ inputs.target_environment }}"
          else
            case "${GITHUB_REF_NAME}" in
              local) target_environment="local" ;;
              development) target_environment="development" ;;
              staging) target_environment="staging" ;;
              master) target_environment="production" ;;
              *)
                echo "No Auth0 deployment mapping exists for ${GITHUB_REF_NAME}." >&2
                exit 1
                ;;
            esac
          fi

          case "${target_environment}" in
            local|development|staging|production) ;;
            *)
              echo "Unsupported Auth0 deployment environment: ${target_environment}" >&2
              exit 1
              ;;
          esac

          echo "target_environment=${target_environment}" >> "${GITHUB_OUTPUT}"
          echo "github_environment=auth0-${target_environment}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve-environment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate ACUL project
        run: npm run validate

      - name: Build ACUL assets
        run: npm run build

      - name: Preserve previous hashed assets during deployment
        run: |
          set -euo pipefail

          # Auth0 is updated after Pages. Keep the previous bundle available so
          # a failed Management API update cannot turn the current Auth0 config
          # into a page that references 404 assets.
          if git cat-file -e HEAD^:dist/assets 2>/dev/null; then
            git archive HEAD^ dist/assets | tar -x
          fi

      - name: Upload built ACUL directory
        uses: actions/upload-artifact@v4
        with:
          name: acul-dist
          path: dist
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  configure-auth0:
    needs:
      - resolve-environment
      - build
      - deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-environment.outputs.github_environment }}

    steps:
      - name: Check out repository scripts
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download built ACUL directory
        uses: actions/download-artifact@v4
        with:
          name: acul-dist
          path: dist

      - name: Generate selected environment rendering configurations
        env:
          ACUL_PUBLIC_BASE_URL: ${{ vars.ACUL_PUBLIC_BASE_URL }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
        run: node scripts/generate-rendering-config.mjs

      - name: Update Auth0 ACUL rendering configuration
        env:
          AUTH0_TENANT_DOMAIN: ${{ vars.AUTH0_TENANT_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          ACUL_PUBLIC_BASE_URL: ${{ vars.ACUL_PUBLIC_BASE_URL }}
          AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
          AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "${AUTH0_TENANT_DOMAIN}" || -z "${AUTH0_CLIENT_ID}" || -z "${ACUL_PUBLIC_BASE_URL}" ]]; then
            echo "Auth0 tenant variables or ACUL_PUBLIC_BASE_URL are not configured for this GitHub Environment." >&2
            exit 1
          fi

          if [[ -z "${AUTH0_MGMT_CLIENT_ID}" || -z "${AUTH0_MGMT_CLIENT_SECRET}" ]]; then
            echo "Auth0 Management API secrets are not configured for the selected GitHub Environment." >&2
            exit 1
          fi

          token_status="$(curl --silent --show-error --retry 3 \
            --request POST "https://${AUTH0_TENANT_DOMAIN}/oauth/token" \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "client_id=${AUTH0_MGMT_CLIENT_ID}" \
            --data-urlencode "client_secret=${AUTH0_MGMT_CLIENT_SECRET}" \
            --data-urlencode "audience=https://${AUTH0_TENANT_DOMAIN}/api/v2/" \
            --data-urlencode 'scope=read:prompts update:prompts' \
            --output /tmp/auth0-token-response.json \
            --write-out '%{http_code}' || true)"

          if [[ ! "${token_status}" =~ ^[0-9]{3}$ ]] || [[ "${token_status}" -lt 200 || "${token_status}" -ge 300 ]]; then
            echo "Auth0 Management API token request failed with HTTP ${token_status}." >&2
            if jq -e . /tmp/auth0-token-response.json >/dev/null 2>&1; then
              jq -c '{error, errorCode, error_description, message, description}' /tmp/auth0-token-response.json >&2
            else
              head -c 2000 /tmp/auth0-token-response.json >&2 || true
              echo >&2
            fi
            exit 1
          fi

          access_token="$(jq --raw-output '.access_token // empty' /tmp/auth0-token-response.json)"
          if [[ -z "${access_token}" ]]; then
            echo "Auth0 token response did not contain an access token." >&2
            exit 1
          fi

          while IFS='|' read -r prompt screen config_file; do
            echo "Updating ${prompt}/${screen} rendering for ${AUTH0_TENANT_DOMAIN}."
            http_status="$(curl --silent --show-error --retry 3 \
              --request PATCH "https://${AUTH0_TENANT_DOMAIN}/api/v2/prompts/${prompt}/screen/${screen}/rendering" \
              --header "authorization: Bearer ${access_token}" \
              --header 'content-type: application/json' \
              --data-binary "@${config_file}" \
              --output /tmp/auth0-rendering-response.json \
              --write-out '%{http_code}' || true)"

            if [[ ! "${http_status}" =~ ^[0-9]{3}$ ]] || [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
              echo "Auth0 ${prompt}/${screen} rendering update failed with HTTP ${http_status}." >&2
              if jq -e . /tmp/auth0-rendering-response.json >/dev/null 2>&1; then
                jq -c '{error, errorCode, error_description, message, description}' /tmp/auth0-rendering-response.json >&2
              else
                head -c 2000 /tmp/auth0-rendering-response.json >&2 || true
                echo >&2
              fi
              exit 1
            fi
          done <<'CONFIGS'
          login|login|config/login-rendering.generated.json
          signup|signup|config/signup-rendering.generated.json
          CONFIGS

          echo "Auth0 login and signup rendering now point to the selected environment's deployed ACUL assets."
